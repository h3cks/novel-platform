version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novelhub-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://user:password@db:5432/novelhub
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_key # У реальному житті використовувати .env
    depends_on:
      - db
      - redis
    networks:
      - novel-network

  db:
    image: postgres:15-alpine
    container_name: novelhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: novelhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - novel-network

  redis:
    image: redis:7-alpine
    container_name: novelhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - novel-network

networks:
  novel-network:
    driver: bridge

volumes:
  pgdata:
  redisdata: